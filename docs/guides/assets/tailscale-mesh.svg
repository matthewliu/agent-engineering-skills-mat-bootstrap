<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="tailscale-mesh-title tailscale-mesh-desc" id="tailscale-mesh-root">
<title id="tailscale-mesh-title">How the laptop, phone, and VPS talk over Tailscale</title><desc id="tailscale-mesh-desc">The laptop, phone, and VPS join one private Tailscale network called a tailnet. Each pair of devices connects through its own encrypted tunnel. Tailscale&#x27;s coordination server shares keys and the device list; your traffic does not pass through it. When a direct path is blocked, an encrypted relay carries the traffic. GitHub, AI providers, and the live app on Render stay on the public internet, outside the tailnet.</desc>
<defs>
      <style>#tailscale-mesh-root { --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#bf4520 }
      #tailscale-mesh-root { font-family: Arial,sans-serif; }
      #tailscale-mesh-root .title { font:30px Georgia,serif;fill:var(--ink) }
      #tailscale-mesh-root .label { font:600 18px Arial,sans-serif;fill:var(--ink) }
      #tailscale-mesh-root .name { font:600 15px Arial,sans-serif;fill:var(--ink) }
      #tailscale-mesh-root .text { font:14px Arial,sans-serif;fill:var(--muted) }
      #tailscale-mesh-root .cmd { font:600 13px ui-monospace,monospace;fill:var(--accent) }
      #tailscale-mesh-root .tag { font:13px ui-monospace,monospace;fill:var(--muted) }
      #tailscale-mesh-root .line { stroke:var(--muted);stroke-width:2;fill:none }</style><marker id="tailscale-mesh-next" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f5d75"/></marker></defs>
<rect width="960" height="720" fill="#f5f5f5"/>
<text x="40" y="48" class="title">Tailscale: one private mesh for your devices.</text>
<text x="40" y="78" class="text">Approved devices reach each other directly, without opening ports to the public internet.</text>
<rect x="30" y="100" width="630" height="460" rx="10" fill="#ececec" stroke="#bf4520" stroke-width="2" stroke-dasharray="8 5"/>
<text x="46" y="126" class="tag">YOUR TAILNET: PRIVATE 100.x.y.z ADDRESSES</text>
<rect x="60" y="170" width="230" height="120" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
<text x="74" y="196" class="tag">LAPTOP</text>
<text x="74" y="224" class="name">Herdr desktop app</text>
<text x="74" y="250" class="text">Local agents.</text>
<text x="74" y="270" class="text">Controls the VPS.</text>
<rect x="400" y="170" width="230" height="120" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
<text x="414" y="196" class="tag">CODING VPS</text>
<text x="414" y="224" class="name">herdr-core + agents</text>
<text x="414" y="250" class="text">Keeps working while</text>
<text x="414" y="270" class="text">the laptop sleeps.</text>
<rect x="230" y="384" width="230" height="120" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
<text x="244" y="410" class="tag">PHONE</text>
<text x="244" y="438" class="name">Herdr mobile app</text>
<text x="244" y="464" class="text">Checks on agents</text>
<text x="244" y="484" class="text">from anywhere.</text>
<path d="M290 230H400" stroke="#2d3142" stroke-width="3" fill="none"/>
<text x="345" y="220" class="cmd" text-anchor="middle">SSH</text>
<path d="M175 290L290 384" stroke="#2d3142" stroke-width="3" fill="none"/>
<text x="206" y="350" class="cmd" text-anchor="middle">SSH</text>
<path d="M515 290L400 384" stroke="#2d3142" stroke-width="3" fill="none"/>
<text x="486" y="350" class="cmd" text-anchor="middle">SSH</text>
<text x="345" y="330" class="text" text-anchor="middle">Each line is an encrypted</text>
<text x="345" y="350" class="text" text-anchor="middle">WireGuard tunnel.</text>
<text x="46" y="542" class="text">Only devices you approve join. An access policy can limit which device reaches which.</text>
<rect x="690" y="110" width="240" height="120" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
<text x="704" y="136" class="tag">TAILSCALE COORDINATION</text>
<text x="704" y="164" class="name">Control server</text>
<text x="704" y="190" class="text">Shares keys and the device</text>
<text x="704" y="210" class="text">list. Your traffic skips it.</text>
<path d="M690 170C640 170 640 150 515 168" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
<rect x="690" y="260" width="240" height="150" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
<text x="704" y="286" class="tag">PUBLIC INTERNET</text>
<text x="704" y="316" class="name">GitHub: code and PRs</text>
<text x="704" y="340" class="name">AI providers: models</text>
<text x="704" y="364" class="name">Render: your live app</text>
<text x="704" y="392" class="text">Outside the tailnet.</text>
<path d="M630 250C665 250 660 300 688 300" class="line" stroke-dasharray="5 4" marker-end="url(#tailscale-mesh-next)"/>
<rect x="690" y="440" width="240" height="120" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
<text x="704" y="466" class="tag">DERP RELAY (FALLBACK)</text>
<text x="704" y="494" class="text">Used when a direct path</text>
<text x="704" y="514" class="text">is blocked, such as some</text>
<text x="704" y="534" class="text">cellular or hotel Wi-Fi.</text>
<path d="M460 450H690" stroke="#4f5d75" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
<text x="575" y="442" class="tag" text-anchor="middle">still encrypted</text>
<text x="40" y="612" class="text">Tailnet: your private network of approved devices. Mesh: each device connects straight to the others.</text>
<text x="40" y="638" class="text">SSH: an encrypted login to another computer. Herdr on the laptop and phone uses SSH to reach the VPS.</text>
<text x="40" y="664" class="text">Tailscale limits who can reach a device. It does not stop an agent that you already authorized.</text>
</svg>
