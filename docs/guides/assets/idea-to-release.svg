<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="release-title release-desc" id="idea-to-release-root">
<title id="release-title">From idea to a released app</title><desc id="release-desc">First research the options. Then choose the product scope. Write the engineering plan. Build in separate worktrees when tasks are independent. Fresh agents review the change and the lead verifies fixes. The owner approves merge and deployment, then checks the released app. Research agreement and successful code generation do not replace human decisions or tests.</desc>
<defs>
      <style>#idea-to-release-root { --paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#bf4520 }
      #idea-to-release-root { font-family: Arial,sans-serif; }
      #idea-to-release-root .title { font:30px Georgia,serif;fill:var(--ink) }
      #idea-to-release-root .label { font:600 20px Arial,sans-serif;fill:var(--ink) }
      #idea-to-release-root .text { font:15px Arial,sans-serif;fill:var(--muted) }
      #idea-to-release-root .tag { font:13px ui-monospace,monospace;fill:var(--muted) }
      #idea-to-release-root .line { stroke:var(--muted);stroke-width:2;fill:none }</style><marker id="idea-to-release-next" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f5d75"/></marker></defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="48" class="title">Agents do the work. You choose the product and release.</text>
<text x="40" y="78" class="text">Follow the numbered path. Use a small first app and dummy data.</text>
<path d="M280 172H360" class="line" marker-end="url(#idea-to-release-next)"/>
<path d="M600 172H680" class="line" marker-end="url(#idea-to-release-next)"/>
<path d="M800 240V328" class="line" marker-end="url(#idea-to-release-next)"/>
<path d="M680 384H600" class="line" marker-end="url(#idea-to-release-next)"/>
<path d="M360 384H280" class="line" marker-end="url(#idea-to-release-next)"/>
<path d="M600 412H680" class="line" stroke-dasharray="5 4" marker-end="url(#idea-to-release-next)"/>
<text x="640" y="438" text-anchor="middle" class="tag">FIXES</text>
<rect x="40" y="112" width="240" height="128" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
<text x="56" y="138" class="tag">01 / RESEARCH</text><text x="56" y="170" class="label">What is possible?</text><text x="56" y="198" class="text">Models examine the same brief.</text><text x="56" y="220" class="text">The lead checks the evidence.</text>
<rect x="360" y="112" width="240" height="128" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
<text x="376" y="138" class="tag">02 / PRODUCT SCOPE</text><text x="376" y="170" class="label">What do we want?</text><text x="376" y="198" class="text">Choose users, priorities, limits.</text><text x="376" y="220" class="text">Interview if requirements vary.</text>
<rect x="680" y="112" width="240" height="128" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
<text x="696" y="138" class="tag">03 / CE PLAN</text><text x="696" y="170" class="label">How will we build it?</text><text x="696" y="198" class="text">Order tasks and dependencies.</text><text x="696" y="220" class="text">Define tests before coding.</text>
<rect x="680" y="328" width="240" height="128" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
<text x="696" y="354" class="tag">04 / CE WORK</text><text x="696" y="386" class="label">Build and test.</text><text x="696" y="414" class="text">Separate worktrees for builders.</text><text x="696" y="436" class="text">Test the combined result.</text>
<rect x="360" y="328" width="240" height="128" rx="6" fill="#f5f5f5" stroke="#4f5d75"/>
<text x="376" y="354" class="tag">05 / REVIEW + PR</text><text x="376" y="386" class="label">What did we miss?</text><text x="376" y="414" class="text">Fresh models review the change.</text><text x="376" y="436" class="text">The lead verifies accepted fixes.</text>
<rect x="40" y="328" width="240" height="128" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="2"/>
<text x="56" y="354" class="tag">06 / APPROVED RELEASE</text><text x="56" y="386" class="label">Merge, then deploy.</text><text x="56" y="414" class="text">Check the live app and rollback.</text><text x="56" y="436" class="text">Update the project status.</text>
<text x="40" y="512" class="text">Read the research summary. Approve the scope. Inspect the plan. Try the preview.</text>
<text x="40" y="540" class="text">Several models agreeing does not prove correctness. Tests and source evidence decide.</text>
<text x="40" y="568" class="text">A branch, worktree, or Python virtual environment does not isolate personal files.</text>
</svg>
