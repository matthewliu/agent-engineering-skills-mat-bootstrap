<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Where your agents run</title>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="system-title system-desc">
<title id="system-title">Where your agents run</title><desc id="system-desc">A laptop runs the Herdr desktop and local agents. It can control a separate coding VPS. A phone uses SSH to each host over the approved private network. Code, transcripts, and credentials stay on each host unless sent elsewhere. Model providers receive prompts. GitHub receives pushed code. Render hosts approved releases. These are separate hosted services.</desc>

<rect width="960" height="660" fill="#f5f5f5"/>
<text x="32" y="40" class="heading">One view. Separate computers and accounts.</text>

<text x="376" y="158" class="name">Laptop: core + agents</text><text x="376" y="182" class="detail">Repos, logs, credentials</text><text x="376" y="202" class="detail">Pauses when laptop sleeps</text>

<text x="376" y="285" class="name">Optional phone</text><text x="376" y="309" class="detail">Control each approved host</text>

<text x="32" y="570" class="detail">Private networking limits reachability. It does not sandbox an authorized agent.</text>
<text x="32" y="596" class="detail">Tailscale uses hosted coordination and may use encrypted relays.</text>
<text x="32" y="622" class="detail">Separate hosts do not share files, conversations, packages, or permissions automatically.</text>
